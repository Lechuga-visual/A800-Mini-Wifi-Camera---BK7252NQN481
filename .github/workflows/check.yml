name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python tools/check_publication.py
      - run: python tools/configure.py
      - run: python tests/test_flash_image.py
      - run: python tests/test_flash_writer.py
      - run: python tests/test_store.py
      - run: python tests/test_interface.py
      - run: python tests/test_http.py
